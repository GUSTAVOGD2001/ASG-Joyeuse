services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: always
    ports:
      - "1884:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_logs:
